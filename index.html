<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HIIT Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app" class="screen-ready">
    <div class="aurora-bg" aria-hidden="true">
      <div class="aurora-wave wave-1"></div>
      <div class="aurora-wave wave-2"></div>
      <div class="aurora-wave wave-3"></div>
      <div class="aurora-wave wave-4"></div>
    </div>

    <div class="timer-section">
      <div id="status-text">READY</div>
      <div id="timer-display" class="odometer-counter">
        <div class="odometer-drum" id="drum-tens">
          <div class="drum-cylinder">
            <span class="drum-digit current">4</span>
            <span class="drum-digit next"></span>
          </div>
          <div class="drum-shade"></div>
        </div>
        <div class="drum-divider"></div>
        <div class="odometer-drum" id="drum-ones">
          <div class="drum-cylinder">
            <span class="drum-digit current">0</span>
            <span class="drum-digit next"></span>
          </div>
          <div class="drum-shade"></div>
        </div>
        <div id="timer-emoji" class="drum-emoji hidden">🎉</div>
      </div>
      <div id="label">EXERCISE</div>
      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>
    </div>

    <div class="bottom-section">
      <div id="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div id="round-indicator">ROUND 1/4</div>
      <div class="controls">
        <button id="start-btn">START WORKOUT</button>
        <button id="pause-btn" class="hidden">PAUSE</button>
        <button id="reset-btn" class="hidden">RESET</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>

</html>
